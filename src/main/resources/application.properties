spring.application.name=wallet-transfer-service

# --- Datasource ---
# Overridden via env vars in docker-compose / cloud deploy:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wallet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wallet}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

# schema.sql uses CREATE TABLE IF NOT EXISTS, so it's safe to run on every boot,
# both for local docker-compose and a fresh managed Postgres on first deploy.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

server.port=${PORT:3000}

# --- Actuator: health + Prometheus metrics ---
# Exposed at the plain paths the exercise spec asks for (/health, /metrics)
# rather than the /actuator/* defaults, so the Dockerfile HEALTHCHECK and the
# burst/monitoring tooling can hit simple, predictable URLs.
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
